name: 3DS Emulator Multi-Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
    - name: Checkout repository (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Build PicoDrive (Mega Drive)
      run: |
        make -f picodrive-make clean
        # 【解決策】コンパイラ引数「-U_NOTHROW」を直接叩き込み、定義されているマクロを強制消滅させます
        # 同時に、無限ループの原因になる超重量アセンブラを回避（use_cyclone=0）させます
        make -f picodrive-make CFLAGS="-U_NOTHROW" CXXFLAGS="-U_NOTHROW -fpermissive" use_cyclone=0 use_drz80=0 use_fame=1

    - name: Build VirtuaNES (NES)
      run: |
        make -f virtuanes-make clean
        # LinuxビルドがWindows.hを探しに行って自爆するバグを、-D_3DSマクロで完全に封じ込めます
        make -f virtuanes-make CFLAGS="-D_3DS -U_NOTHROW" CXXFLAGS="-D_3DS -U_NOTHROW -fpermissive"

    - name: Build TemperPCE (PC Engine)
      run: |
        make -f temperpce-make clean
        make -f temperpce-make CFLAGS="-D_3DS -U_NOTHROW" CXXFLAGS="-D_3DS -U_NOTHROW -fpermissive"

    - name: Upload Artifacts (All CIA/3DSX)
      uses: actions/upload-artifact@v4
      with:
        name: 3ds-emulators-all-build
        path: |
          *.cia
          *.3dsx
