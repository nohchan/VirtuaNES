name: 3DS Emulator Multi-Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
    - name: Checkout repository (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Build PicoDrive (Mega Drive)
      run: |
        make -f picodrive-make clean
        # makeの引数として直接C/C++フラグを追加し、メイクファイル内の上書きを強制突破します
        make -f picodrive-make CFLAGS="-fpermissive" CXXFLAGS="-fpermissive"

    - name: Build VirtuaNES (NES)
      run: |
        make -f virtuanes-make clean
        make -f virtuanes-make CFLAGS="-fpermissive" CXXFLAGS="-fpermissive"

    - name: Build TemperPCE (PC Engine)
      run: |
        make -f temperpce-make clean
        make -f temperpce-make CFLAGS="-fpermissive" CXXFLAGS="-fpermissive"

    - name: Upload Artifacts (All CIA/3DSX)
      uses: actions/upload-artifact@v4
      with:
        name: 3ds-emulators-all-build
        path: |
          *.cia
          *.3dsx
