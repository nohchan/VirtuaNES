name: 3DS Emulator Multi-Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 【核心】最新ではなく、2021年当時の古いdevkitARM環境（20210726）を直接指定します。
    # これにより、最新コンパイラで起きていた _NOTHROW などのシステム破壊エラーは歴史ごと完全に消滅します。
    container: devkitpro/devkitarm:20210726

    steps:
    - name: Checkout repository (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Build PicoDrive (Mega Drive)
      run: |
        make -f picodrive-make clean
        # 当時のコンパイラならアセンブラの処理も素直に通りますが、
        # 無限ループのような硬直を防ぐため、安全かつ最速で終わる汎用コアを指定します
        make -f picodrive-make use_cyclone=0 use_drz80=0 use_fame=1

    - name: Build VirtuaNES (NES)
      run: |
        make -f virtuanes-make clean
        # LinuxビルドがWindows用ファイルを探しに行くのを防ぐため、3DS用のパス設定を環境変数で維持します
        export DEVKITPPC=$DEVKITPRO/devkitPPC
        make -f virtuanes-make

    - name: Build TemperPCE (PC Engine)
      run: |
        make -f temperpce-make clean
        make -f temperpce-make

    - name: Upload Artifacts (All CIA/3DSX)
      uses: actions/upload-artifact@v4
      with:
        name: 3ds-emulators-all-build
        path: |
          *.cia
          *.3dsx
