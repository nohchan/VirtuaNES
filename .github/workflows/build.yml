name: 3DS Emulator Multi-Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
    - name: Checkout repository (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Pre-fix Makefiles (Erase _NOTHROW from logic)
      run: |
        # メイクファイルのテキストデータから、標準ライブラリを破壊する「-D_NOTHROW=」の文字列だけを物理的に消去します
        # これにより、3DS用のインcludepathを一切壊すことなく、呪いのマクロだけを大元から完全に消し去ります
        sed -i 's/-D_NOTHROW=//g' picodrive-make
        sed -i 's/-D_NOTHROW=//g' virtuanes-make
        sed -i 's/-D_NOTHROW=//g' temperpce-make

    - name: Build PicoDrive (Mega Drive)
      run: |
        make -f picodrive-make clean
        # フラグ上書きを一切やめ、メイクファイル本来の正しいパス設定だけでビルドを実行します
        # 無限ループを回避するためにC言語コアを指定
        make -f picodrive-make use_cyclone=0 use_drz80=0 use_fame=1

    - name: Build VirtuaNES (NES)
      run: |
        make -f virtuanes-make clean
        make -f virtuanes-make

    - name: Build TemperPCE (PC Engine)
      run: |
        make -f temperpce-make clean
        make -f temperpce-make

    - name: Upload Artifacts (All CIA/3DSX)
      uses: actions/upload-artifact@v4
      with:
        name: 3ds-emulators-all-build
        path: |
          *.cia
          *.3dsx
