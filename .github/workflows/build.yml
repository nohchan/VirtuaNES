name: Build 3DS Emulators (Archive Online)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 📦 一度ビルドが成功すれば、2回目以降は一瞬で終わるキャッシュ機能
      - name: Cache devkitPro Environment
        id: cache-devkitpro
        uses: actions/cache@v4
        with:
          path: /opt/devkitpro
          key: devkitpro-archive-r45-v1

      - name: Setup Legacy devkitARM r45 (From Archive)
        if: steps.cache-devkitpro.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/devkitpro
          cd /opt
          
          # 🏛️ 絶対に消えないインターネットアーカイブ（Wayback Machine）の永久保存リンクから直接ダウンロード
          sudo wget https://archive.org
          sudo tar -xjf devkitARM_r45-x86_64-linux.tar.bz2 -C devkitpro
          
          sudo wget https://archive.org
          sudo tar -xjf libctru-1.0.0.tar.bz2 -C devkitpro
          
          sudo wget https://archive.org
          sudo tar -xjf citro3d-1.0.0.tar.bz2 -C devkitpro

      - name: Build VirtuaNES
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          make -f virtuanes-make

      - name: Build PicoDrive
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          make -f picodrive-make

      - name: Build TemperPCE
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          make -f temperpce-make

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 3ds-emulators
          path: |
            *.3dsx
            *.cia
            *.smdh
