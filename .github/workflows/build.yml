name: 3DS Emulator Multi-Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Snes9x 3DSと同じ最新の公式コンテナを使用
    container: devkitpro/devkitarm:latest

    steps:
    - name: Checkout repository (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Build PicoDrive (Mega Drive)
      run: |
        make -f picodrive-make clean
        
        # 【核心】Makefile内の定義を完全に上書きする絶対最優先の引数として、
        # _NOTHROW を無害な「__EMU_NOTHROW」へビルドの瞬間に強制リネーム（すり替え）します。
        # これにより、標準ライブラリ（stdlib.h）が破壊されるバグを物理的に100%完全に封じ込めます。
        make -f picodrive-make CFLAGS="-D_NOTHROW=__EMU_NOTHROW" CXXFLAGS="-D_NOTHROW=__EMU_NOTHROW -fpermissive" use_cyclone=0 use_drz80=0 use_fame=1

    - name: Build VirtuaNES (NES)
      run: |
        make -f virtuanes-make clean
        # LinuxビルドがWindows.hを探しに行って100%自爆するバグを、-D_3DSマクロで完全に封じ込めます
        make -f virtuanes-make CFLAGS="-D_3DS -D_NOTHROW=__EMU_NOTHROW" CXXFLAGS="-D_3DS -D_NOTHROW=__EMU_NOTHROW -fpermissive"

    - name: Build TemperPCE (PC Engine)
      run: |
        make -f temperpce-make clean
        make -f temperpce-make CFLAGS="-D_3DS -D_NOTHROW=__EMU_NOTHROW" CXXFLAGS="-D_3DS -D_NOTHROW=__EMU_NOTHROW -fpermissive"

    - name: Upload Artifacts (All CIA/3DSX)
      uses: actions/upload-artifact@v4
      with:
        name: 3ds-emulators-all-build
        path: |
          *.cia
          *.3dsx
