name: Build 3DS Emulators (Modern Base Environment)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # ⭕ 公式の最新コンパイル環境のみを使用
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install 3DS Tools & Libraries
        run: |
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S 3ds-dev --noconfirm

      # 🛠️ 3つのアプリをストレートに実行します
      - name: Build VirtuaNES (FC)
        run: make -f virtuanes-make

      - name: Build PicoDrive (MD)
        run: make -f picodrive-make

      - name: Build TemperPCE (PCE)
        run: make -f temperpce-make

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 3ds-emulators
          path: |
            *.3dsx
            *.cia
            *.smdh
