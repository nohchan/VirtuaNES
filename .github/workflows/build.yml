name: 3DS Emulator Multi-Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
    - name: Checkout repository (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Build PicoDrive (Mega Drive)
      run: |
        make -f picodrive-make clean
        # CXXFLAGSを上書きするのではなく、環境変数として後ろからマクロを大目にみるオプションを追加します
        export CXXFLAGS="$CXXFLAGS -fpermissive"
        make -f picodrive-make

    - name: Build VirtuaNES (NES)
      run: |
        make -f virtuanes-make clean
        export CXXFLAGS="$CXXFLAGS -fpermissive"
        make -f virtuanes-make

    - name: Build TemperPCE (PC Engine)
      run: |
        make -f temperpce-make clean
        export CXXFLAGS="$CXXFLAGS -fpermissive"
        make -f temperpce-make

    - name: Upload Artifacts (All CIA/3DSX)
      uses: actions/upload-artifact@v4
      with:
        name: 3ds-emulators-all-build
        path: |
          *.cia
          *.3dsx
