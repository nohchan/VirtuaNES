name: 3DS Emulator Multi-Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Snes9x 3DSと同じ、一番安定してパスが通る最新の公式コンテナを使用
    container: devkitpro/devkitarm:latest

    steps:
    - name: Checkout repository (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Purge _NOTHROW macro from entire repository
      run: |
        # 【解決策】リポジトリ内のすべての設定ファイル・ソースコードから「-D_NOTHROW=」の記述を物理的に完全消去します
        # これにより、3DS用のインクルードパスを一切壊すことなく、呪いのマクロだけを大元から完全に抹消します
        find . -type f \( -name "*.make" -o -name "Makefile" -o -name "*.h" -o -name "*.cpp" \) -exec sed -i 's/-D_NOTHROW=//g' {} +

    - name: Build PicoDrive (Mega Drive)
      run: |
        make -f picodrive-make clean
        # フラグの上書きを一切やめ、メイクファイル本来の正しいパス設定だけで安全にビルドを実行します
        # 無限ループを回避するためにC言語コアを指定
        make -f picodrive-make use_cyclone=0 use_drz80=0 use_fame=1

    - name: Build VirtuaNES (NES)
      run: |
        make -f virtuanes-make clean
        make -f virtuanes-make

    - name: Build TemperPCE (PC Engine)
      run: |
        make -f temperpce-make clean
        make -f temperpce-make

    - name: Upload Artifacts (All CIA/3DSX)
      uses: actions/upload-artifact@v4
      with:
        name: 3ds-emulators-all-build
        path: |
          *.cia
          *.3dsx
