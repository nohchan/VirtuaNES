name: Build 3DS Emulators (Direct Compilation)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # ⭕ 確実に実在する公式の最新環境のみを使用
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🛠️ 403で落ちる「dkp-pacman」は一切使いません。
      # 最新コンテナには最初から基本的な3DSツールが入っているため、
      # 直接 make コマンドを叩いて、発生するエラーを特定します。

      - name: Build VirtuaNES (FC)
        run: |
          make -f virtuanes-make

      - name: Build PicoDrive (MD)
        run: |
          make -f picodrive-make

      - name: Build TemperPCE (PCE)
        run: |
          make -f temperpce-make

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 3ds-emulators
          path: |
            *.3dsx
            *.cia
            *.smdh
