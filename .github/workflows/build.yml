name: 3DS Emulator Multi-Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
    - name: Checkout repository (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Build PicoDrive (Mega Drive)
      run: |
        make -f picodrive-make clean
        
        # 【核心】コンパイラ起動コマンド自体にリネームオプションを直接常時付与します。
        # これにより、3DS用のパス設定を一切破壊せず、Makefile内の上書きを強制突破してマクロを無害化します。
        make -f picodrive-make \
          CC="arm-none-eabi-gcc -D_NOTHROW=__EMU_NOTHROW" \
          CXX="arm-none-eabi-g++ -D_NOTHROW=__EMU_NOTHROW -fpermissive" \
          use_cyclone=0 use_drz80=0 use_fame=1

    - name: Build VirtuaNES (NES)
      run: |
        make -f virtuanes-make clean
        make -f virtuanes-make \
          CC="arm-none-eabi-gcc -D_NOTHROW=__EMU_NOTHROW -D_3DS" \
          CXX="arm-none-eabi-g++ -D_NOTHROW=__EMU_NOTHROW -fpermissive -D_3DS"

    - name: Build TemperPCE (PC Engine)
      run: |
        make -f temperpce-make clean
        make -f temperpce-make \
          CC="arm-none-eabi-gcc -D_NOTHROW=__EMU_NOTHROW -D_3DS" \
          CXX="arm-none-eabi-g++ -D_NOTHROW=__EMU_NOTHROW -fpermissive -D_3DS"

    - name: Upload Artifacts (All CIA/3DSX)
      uses: actions/upload-artifact@v4
      with:
        name: 3ds-emulators-all-build
        path: |
          *.cia
          *.3dsx
