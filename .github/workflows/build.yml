name: Build 3DS Emulators (Safe Direct Cloud Link)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 📦 2回目以降を爆速にするキャッシュ機能
      - name: Cache devkitPro Environment
        id: cache-devkitpro
        uses: actions/cache@v4
        with:
          path: /opt/devkitpro
          key: devkitpro-safe-cloud-r45-v1

      # ⬇️ 2016年当時の本物のファイルを確実に直接ダウンロードします
      - name: Setup Legacy devkitARM r45 (Direct Cloud Link)
        if: steps.cache-devkitpro.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/devkitpro
          cd /opt
          
          # devkitARM r45 (約36MB)
          sudo wget -O devkitARM_r45-x86_64-linux.tar.bz2 "https://dropbox.com"
          sudo tar -xjf devkitARM_r45-x86_64-linux.tar.bz2 -C devkitpro
          
          # libctru v1.0.0 (約3MB)
          sudo wget -O libctru-1.0.0.tar.bz2 "https://dropbox.com"
          sudo tar -xjf libctru-1.0.0.tar.bz2 -C devkitpro
          
          # citro3d v1.0.0 (約150KB)
          sudo wget -O citro3d-1.0.0.tar.bz2 "https://dropbox.com"
          sudo tar -xjf citro3d-1.0.0.tar.bz2 -C devkitpro

      - name: Build VirtuaNES
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          make -f virtuanes-make

      - name: Build PicoDrive
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          make -f picodrive-make

      - name: Build TemperPCE
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          make -f temperpce-make

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 3ds-emulators
          path: |
            *.3dsx
            *.cia
            *.smdh
