name: Build 3DS Emulators (No-Pacman Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # ⭕ 3DSビルド用のライブラリ群(libctru等)が、最初から「すべて導入・展開済み」の公式コンテナを指定します
    # これにより dkp-pacman の 403 接続拒否エラーを完全に回避します
    container: devkitpro/devkit3ds:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🪄 dkp-pacman のステップを完全に消去しました。
      # すでに環境は整っているので、そのまま3つのアプリのビルドへ進みます。

      - name: Build VirtuaNES (FC)
        run: |
          make -f virtuanes-make

      - name: Build PicoDrive (MD)
        run: |
          make -f picodrive-make

      - name: Build TemperPCE (PCE)
        run: |
          make -f temperpce-make

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 3ds-emulators
          path: |
            *.3dsx
            *.cia
            *.smdh
