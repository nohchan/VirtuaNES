name: Build 3DS Emulators (Legacy Environment)

on:
  workflow_dispatch:

jobs:
  build:
    # 2016年当時の古い環境を再現するため、あえて古いUbuntuを使用します
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Legacy devkitARM r45
        run: |
          # 2016年当時の古いdevkitARM (r45) と 3DS用の古いライブラリをダウンロードして配置
          sudo mkdir -p /opt/devkitpro
          cd /opt
          
          # devkitARM r45 のダウンロードと展開
          sudo wget https://leseratte10.de
          sudo tar -xjf devkitARM_r45-x86_64-linux.tar.bz2 -C devkitpro
          
          # 当時の libctru (v1.0.0) と citro3d (v1.0.0) の展開
          sudo wget https://leseratte10.de
          sudo tar -xjf libctru-1.0.0.tar.bz2 -C devkitpro
          
          sudo wget https://leseratte10.de
          sudo tar -xjf citro3d-1.0.0.tar.bz2 -C devkitpro

      - name: Build VirtuaNES
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          make -f virtuanes-make

      - name: Build PicoDrive
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          make -f picodrive-make

      - name: Build TemperPCE
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          make -f temperpce-make

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 3ds-emulators
          path: |
            *.3dsx
            *.cia
            *.smdh
