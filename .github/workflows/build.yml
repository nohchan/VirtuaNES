name: 3DS Emulator Auto Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
    - name: Checkout repository (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: 'recursive' # 👈 空っぽの外部フォルダを自動で全部ダウンロードする命令

    - name: Install 3DS dependency libraries
      run: |
        apt-get update && apt-get install -y make
        dkp-pacman -Syu --noconfirm 3ds-dev 3ds-libctru 3ds-citro3d 3ds-citro2d

    - name: Build PicoDrive (Mega Drive)
      run: |
        # 👈 メガドライブ版（PicoDrive）専用のメイクコマンドを実行
        make -f picodrive-make clean
        make -f picodrive-make
