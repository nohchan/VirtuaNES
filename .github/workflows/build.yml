name: 3DS Emulator Multi-Build
 
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Snes9x 3DSと同じ、一番安定してパスが通る最新の公式コンテナを使用
    container: devkitpro/devkitarm:latest

    steps:
    - name: Checkout repository (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Build PicoDrive (Mega Drive)
      run: |
        make -f picodrive-make clean
        
        # 【解決策】3DSのパス環境を一切破壊せず、後ろから安全に「マクロ強制すり替え（リネーム）」を合流させます
        export AM_CFLAGS="-D_NOTHROW=__EMU_NOTHROW"
        export AM_CXXFLAGS="-D_NOTHROW=__EMU_NOTHROW -fpermissive"
        
        # 無限ループを回避するためにC言語コアを指定してビルドを実行
        make -f picodrive-make use_cyclone=0 use_drz80=0 use_fame=1

    - name: Build VirtuaNES (NES)
      run: |
        make -f virtuanes-make clean
        export AM_CFLAGS="-D_NOTHROW=__EMU_NOTHROW -D_3DS"
        export AM_CXXFLAGS="-D_NOTHROW=__EMU_NOTHROW -fpermissive -D_3DS"
        make -f virtuanes-make

    - name: Build TemperPCE (PC Engine)
      run: |
        make -f temperpce-make clean
        export AM_CFLAGS="-D_NOTHROW=__EMU_NOTHROW -D_3DS"
        export AM_CXXFLAGS="-D_NOTHROW=__EMU_NOTHROW -fpermissive -D_3DS"
        make -f temperpce-make

    - name: Upload Artifacts (All CIA/3DSX)
      uses: actions/upload-artifact@v4
      with:
        name: 3ds-emulators-all-build
        path: |
          *.cia
          *.3dsx
