name: 3DS Emulator Multi-Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
    - name: Checkout repository (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Build PicoDrive (Mega Drive)
      run: |
        # 厳格なC++ルールを緩める「-fpermissive」を直接コンパイラ（CXXFLAGS）に叩き込みます
        make -f picodrive-make CXXFLAGS="-fpermissive" clean
        make -f picodrive-make CXXFLAGS="-fpermissive"

    - name: Build VirtuaNES (NES)
      run: |
        make -f virtuanes-make CXXFLAGS="-fpermissive" clean
        make -f virtuanes-make CXXFLAGS="-fpermissive"

    - name: Build TemperPCE (PC Engine)
      run: |
        make -f temperpce-make CXXFLAGS="-fpermissive" clean
        make -f temperpce-make CXXFLAGS="-fpermissive"

    - name: Upload Artifacts (All CIA/3DSX)
      uses: actions/upload-artifact@v4
      with:
        name: 3ds-emulators-all-build
        path: |
          *.cia
          *.3dsx
